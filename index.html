<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkanoid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="wrapper">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="overlay" hidden></div>
    </div>

    <!-- Controles táctiles: solo visibles en pantallas táctiles -->
    <button id="left-button" class="touch-control" type="button" aria-label="Izquierda">◀</button>
    <button id="pause-button" class="touch-control" type="button" aria-label="Pausa">❚❚</button>
    <button id="action-button" class="touch-control" type="button" aria-label="Lanzar">●</button>
    <button id="right-button" class="touch-control" type="button" aria-label="Derecha">▶</button>
  </div>

  <script src="assets/spritesheet.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
